databases:
  - name: agritwin-db
    plan: starter
    databaseName: agritwin
    user: agritwin
    postgresMajorVersion: "16"
    # Render's managed Postgres doesn't enable PostGIS by default - after the
    # database is created, connect with psql and run:
    #   CREATE EXTENSION IF NOT EXISTS postgis;
    # (schema.sql does this too, but the extension needs a superuser the app's
    # own role may not have - check Render's PostGIS docs if this fails.)

services:
  - type: web
    name: agritwin-backend
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agritwin-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # set to your deployed Vercel frontend URL
      - key: GEE_SERVICE_ACCOUNT
        sync: false
      - key: GEE_PRIVATE_KEY_JSON
        sync: false # paste the full contents of the downloaded key JSON here
      - key: GEE_PROJECT
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
